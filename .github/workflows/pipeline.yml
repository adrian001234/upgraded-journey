name: TechPulse Pipeline
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check whether a new story should be started
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'EOF'
          import os, json, urllib.request, sys

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_ANON_KEY", "")
          gh_output = os.environ["GITHUB_OUTPUT"]

          # Long-form videos take many runs to finish (60-90 shots, Agnes is
          # rate-limited per-minute), so this pipeline now runs every 15 min
          # and every stage below is safe to call every time - each one just
          # picks up whatever row is furthest along and no-ops if there's
          # nothing at its stage yet. The ONLY thing gated here is starting a
          # brand NEW story: research+script only fire if nothing is currently
          # in progress (scripted/narrated/video_complete), so we never queue
          # up a second story while the first is still being produced.
          if not url or not key:
              print("Supabase creds missing - allowing a new story to start to be safe.")
              with open(gh_output, "a") as f:
                  f.write("start_new_story=true\n")
              sys.exit(0)

          req = urllib.request.Request(
              f"{url}/rest/v1/video_pipeline?select=id&status=in.(scripted,narrated,video_complete)&limit=1",
              headers={"apikey": key, "Authorization": f"Bearer {key}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  rows = json.loads(resp.read())
          except Exception as e:
              print(f"Could not reach Supabase ({e}) - allowing a new story to start to be safe.")
              with open(gh_output, "a") as f:
                  f.write("start_new_story=true\n")
              sys.exit(0)

          in_progress = len(rows) > 0
          print(f"Story already in progress: {in_progress}")
          with open(gh_output, "a") as f:
              f.write(f"start_new_story={'false' if in_progress else 'true'}\n")
          EOF
      - name: Install dependencies
        run: pip install feedparser requests pydub google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 chatterbox-tts
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Research stage
        if: steps.gate.outputs.start_new_story == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
