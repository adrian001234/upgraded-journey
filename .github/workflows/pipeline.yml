name: Tiny Lawn Tales Pipeline
on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
concurrency:
  group: tiny-lawn-tales-pipeline
  cancel-in-progress: false
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pydub google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Video stage
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHARACTER_REFERENCE_URL: ${{ vars.CHARACTER_REFERENCE_URL }}
          CHARACTER_REFERENCE_NAME: ${{ vars.CHARACTER_REFERENCE_NAME }}
        run: python -u video/generate_video.py
      - name: Assembly stage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python assembly/assemble.py
      - name: Publish stage
        if: vars.YOUTUBE_READY == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python publish/youtube_upload.py
