name: TechPulse Pipeline
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check whether a new story should be started
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, sys

          url = os.environ.get("SUPABASE_URL", "")
          key = os.environ.get("SUPABASE_ANON_KEY", "")
          gh_output = os.environ["GITHUB_OUTPUT"]

          if not url or not key:
              print("Supabase creds missing - allowing a new story to start to be safe.")
              with open(gh_output, "a") as f:
                  f.write("start_new_story=true\n")
              sys.exit(0)

          req = urllib.request.Request(
              f"{url}/rest/v1/video_pipeline?select=id&status=in.(scripted,narrated,video_complete)&limit=1",
              headers={"apikey": key, "Authorization": f"Bearer {key}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  rows = json.loads(resp.read())
          except Exception as e:
              print(f"Could not reach Supabase ({e}) - allowing a new story to start to be safe.")
              with open(gh_output, "a") as f:
                  f.write("start_new_story=true\n")
              sys.exit(0)

          in_progress = len(rows) > 0
          print(f"Story already in progress: {in_progress}")
          with open(gh_output, "a") as f:
              f.write(f"start_new_story={'false' if in_progress else 'true'}\n")
          PYEOF
      - name: Install dependencies
        run: pip install feedparser requests pydub google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2 chatterbox-tts
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Research stage
        if: steps.gate.outputs.start_new_story == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python research/sources.py
      - name: Script stage
        if: steps.gate.outputs.start_new_story == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python script/generate_script.py
      - name: Narration stage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CHATTERBOX_VOICE_REF_URL: ${{ vars.CHATTERBOX_VOICE_REF_URL }}
        run: python narration/generate_narration.py
      - name: Video stage
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python video/generate_video.py
      - name: Assembly stage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python assembly/assemble.py
      - name: Publish stage
        if: vars.YOUTUBE_READY == 'true'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python publish/youtube_upload.py
