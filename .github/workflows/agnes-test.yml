name: Agnes Quick Test
on:
  workflow_dispatch:
jobs:
  agnes-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Test old and new Agnes model with a 4 second clip
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error

          KEY = os.environ["AGNES_API_KEY"]
          SUBMIT = "https://apihub.agnes-ai.com/v1/videos"
          POLL = "https://apihub.agnes-ai.com/agnesapi"
          H = {"Authorization": "Bearer " + KEY, "Content-Type": "application/json"}

          def poll(video_id, model):
              url = POLL + "?video_id=" + str(video_id) + "&model_name=" + model
              last = None
              waited = 0
              while waited < 900:
                  try:
                      req = urllib.request.Request(url, headers=H)
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = json.loads(r.read())
                      status = data.get("status")
                      if status != last:
                          print("status:", status, "after", waited, "s", flush=True)
                          last = status
                      if status == "completed":
                          print("DONE. Video URL:", data.get("url") or data.get("video_url"), flush=True)
                          return
                      if status == "failed":
                          print("FAILED:", json.dumps(data)[:500], flush=True)
                          return
                  except Exception as e:
                      print("poll error:", repr(e), flush=True)
                  time.sleep(10)
                  waited += 10
              print("Not finished after 900s", flush=True)

          def attempt(model):
              print("=== TEST MODEL:", model, flush=True)
              payload = {
                  "model": model,
                  "prompt": "A small orange garden snail slowly crawling across a sunny green lawn, 3D animated style.",
                  "mode": "text",
                  "seconds": "4",
                  "size": "720P",
                  "aspect_ratio": "16:9",
                  "n": 1,
              }
              req = urllib.request.Request(SUBMIT, data=json.dumps(payload).encode(), method="POST", headers=H)
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      body = r.read().decode(errors="replace")
                      print("HTTP", r.status, "after", round(time.time() - t, 1), "s", flush=True)
                      print("Body:", body[:500], flush=True)
                      data = json.loads(body)
                      vid = data.get("video_id") or data.get("id")
                      if vid:
                          poll(vid, model)
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, "after", round(time.time() - t, 1), "s", flush=True)
                  print("Body:", e.read().decode(errors="replace")[:500], flush=True)
              except Exception as e:
                  print("ERROR:", repr(e), flush=True)

          attempt("agnes-video-v2.0")
          print("Waiting 70 seconds (Agnes allows about 1 request per minute)...", flush=True)
          time.sleep(70)
          attempt("agnes-video-2.5-flash")
          PY
